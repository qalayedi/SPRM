  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"170f0bda-d988-4aeb-878d-db46efb28dba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:#000;\n    --fg:#f4f4f1;          /* off-white */\n    --fg-dim:#9b9b97;      /* dimmed mono */\n    --fg-faint:#3a3a38;    /* hairline / faintest */\n    --rule:#2a2a28;\n    --hair:rgba(244,244,241,0.14);\n    --hair-strong:rgba(244,244,241,0.28);\n    --grotesk:\"Space Grotesk\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    --mono:\"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%;}\n  body{\n    font-family:var(--mono);\n    font-weight:400;\n    font-size:13px;\n    line-height:1.55;\n    -webkit-font-smoothing:antialiased;\n    text-rendering:geometricPrecision;\n    overflow-x:hidden;\n  }\n  ::selection{background:#f4f4f1;color:#000;}\n\n  /* custom cursor */\n  * { cursor: none !important; }\n\n  #cursor {\n    position: fixed;\n    top: 0; left: 0;\n    pointer-events: none;\n    z-index: 9999;\n    will-change: transform;\n  }\n\n  #cursor svg {\n    width: 30px;\n    height: 8px;\n    overflow: visible;\n    filter: drop-shadow(0 0 1px rgba(255,255,255,0.4));\n  }\n\n  a{color:inherit;text-decoration:none;}\n\n  /* ---------- shared mono utilities ---------- */\n  .mono{font-family:var(--mono);font-weight:400;letter-spacing:0.02em;}\n  .mono-xs{font-family:var(--mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-dim);}\n  .mono-sm{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;}\n  .mono-md{font-family:var(--mono);font-size:13px;letter-spacing:0.06em;}\n  .dim{color:var(--fg-dim);}\n  .faint{color:var(--fg-faint);}\n  .hair{height:1px;background:var(--hair);width:100%;}\n\n  /* ---------- page chrome: corner annotations + edge grid ---------- */\n  .chrome{\n    position:fixed;inset:0;pointer-events:none;z-index:10;\n  }\n  .chrome .corner{\n    position:absolute;display:flex;flex-direction:column;gap:6px;\n    font-family:var(--mono);font-size:10px;letter-spacing:0.18em;\n    text-transform:uppercase;color:var(--fg-dim);\n  }\n  .chrome .corner.tl{top:24px;left:24px;}\n  .chrome .corner.tr{top:24px;right:24px;align-items:flex-end;text-align:right;}\n  .chrome .corner.bl{bottom:24px;left:24px;}\n  .chrome .corner.br{bottom:24px;right:24px;align-items:flex-end;text-align:right;}\n  .chrome .corner .row{display:flex;align-items:center;gap:10px;}\n  .chrome .corner .tick{width:6px;height:6px;border:1px solid var(--fg-dim);}\n  .chrome .corner .dot{width:5px;height:5px;background:var(--fg);border-radius:50%;animation:pulse 1.6s infinite ease-in-out;}\n\n  /* hairline frame inside the page */\n  .frame{\n    position:fixed;inset:18px;border:1px solid var(--hair);pointer-events:none;z-index:5;\n  }\n  /* corner crosshairs */\n  .crosshair{position:absolute;width:14px;height:14px;pointer-events:none;}\n  .crosshair::before,.crosshair::after{content:\"\";position:absolute;background:var(--fg);}\n  .crosshair::before{left:0;right:0;top:50%;height:1px;transform:translateY(-50%);}\n  .crosshair::after{top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);}\n  .ch-tl{top:11px;left:11px;}\n  .ch-tr{top:11px;right:11px;}\n  .ch-bl{bottom:11px;left:11px;}\n  .ch-br{bottom:11px;right:11px;}\n\n  /* first-screen wrapper: header + hero = exactly one viewport */\n  .screen-one{\n    display:flex;\n    flex-direction:column;\n  }\n\n  /* ---------- TOP BAR (semantic header inside the frame) ---------- */\n  header.top{\n    position:fixed;top:0;left:0;right:0;z-index:60;\n    display:flex;justify-content:space-between;align-items:center;\n    padding:28px 56px;\n    color:var(--fg-dim);\n  }\n  header.top .lockup{display:flex;align-items:center;gap:14px;color:var(--fg);}\n  header.top .lockup .pixel,footer .copy .pixel{\n    font-family:'ZX Spectrum',ui-monospace,monospace;\n    font-size:13px;letter-spacing:1px;line-height:1;\n  }\n  header.top .tagline{\n    position:absolute;left:50%;transform:translateX(-50%);\n    color:var(--fg-dim);white-space:nowrap;text-align:center;\n    pointer-events:none;\n  }\n  header.top .lockup .mark{\n    width:18px;height:18px;position:relative;display:inline-flex;\n    align-items:center;justify-content:center;\n  }\n  header.top .lockup .mark img{width:100%;height:100%;object-fit:contain;display:block;}\n  /* fallback square mark when no logo file is present */\n  header.top .lockup .mark--fallback{border:1px solid var(--fg);width:14px;height:14px;}\n  header.top .lockup .mark--fallback::after{\n    content:\"\";position:absolute;inset:3px;background:var(--fg);\n  }\n  header.top .meta{display:flex;gap:36px;}\n  header.top .meta span b{color:var(--fg);font-weight:400;}\n\n  header.top .icons.top-icons{display:flex;gap:14px;align-items:center;}\n  header.top .icons.top-icons a{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:30px;height:30px;border:1px solid var(--hair);\n    color:var(--fg);transition:border-color .2s ease;\n  }\n  header.top .icons.top-icons a:hover{border-color:var(--fg);}\n\n  /* ---------- HERO ---------- */\n  main{position:relative;z-index:6;}\n  .hero{\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    justify-content:center;\n    min-height:100vh;\n    padding:0 56px;\n    position:relative;\n  }\n\n  /* huge SPRM wordmark */\n  .wordmark{\n    text-align:center;\n    color:var(--fg);\n    display:inline-flex;justify-content:center;align-items:center;\n    position:relative;\n    width:fit-content;\n  }\n  .wordmark-img{\n    display:block;\n    width:clamp(150px, 16vw, 240px);\n    height:auto;\n    object-fit:contain;\n    user-select:none;\n    position:relative;z-index:1;\n  }\n  /* arched lockup text ring around the logo */\n  .wordmark-ring{\n    position:absolute;left:50%;top:50%;\n    transform:translate(-50%,-50%);\n    width:172%;height:auto;aspect-ratio:1/1;\n    pointer-events:none;\n    overflow:visible;\n    z-index:1;\n  }\n  .wordmark-ring text{\n    font-family:'JetBrains Mono',ui-monospace,monospace;\n    font-size:9.6px;\n    font-weight:500;\n    letter-spacing:normal;\n    fill:var(--fg);\n    -webkit-text-size-adjust:none;text-size-adjust:none;\n  }  .wordmark-ring .ring-bottom text{fill:var(--fg);}\n  /* nucleus hover glow */\n  .wordmark-nucleus{\n    position:absolute;left:51%;top:52%;\n    width:15%;aspect-ratio:1/1;border-radius:50%;\n    transform:translate(-50%,-50%);\n    background:transparent;\n    box-shadow:0 0 0 0 rgba(255,255,255,0);\n    transition:box-shadow .35s ease, background .35s ease;\n    z-index:2;cursor:pointer;\n  }\n  .wordmark-nucleus:hover{\n    background:rgba(255,255,255,0.10);\n    box-shadow:0 0 14px 5px rgba(255,255,255,0.28), 0 0 34px 14px rgba(255,255,255,0.12);\n  }\n\n  /* sublabel pinned to the bottom of hero */\n  .sublabel{\n    position:absolute;\n    left:56px;right:56px;bottom:56px;\n    display:flex;justify-content:space-between;align-items:flex-end;\n    margin-top:14px;\n    color:var(--fg-dim);\n  }\n  .sublabel .left, .sublabel .right{display:flex;gap:22px;align-items:center;}\n  .sublabel .by{color:var(--fg);}\n\n  /* specimen feed */\n  .feed-head{\n    display:flex;align-items:center;gap:16px;\n    width:100%;margin:0 0 14px;\n    color:var(--fg);\n  }\n  .feed-head .rule{flex:1;height:1px;background:var(--hair-strong);}\n  .feed-head .ttl{letter-spacing:4px;white-space:nowrap;}\n  .feed-wrap{\n    display:flex;flex-direction:column;align-items:center;\n    margin:clamp(48px, 7vw, 110px) auto 0;\n    width:min(880px, 88%);\n  }\n  .feed{\n    position:relative;\n    width:100%;\n    aspect-ratio:16/9;\n    background:#040404;\n    border:1px solid var(--hair-strong);\n    overflow:hidden;\n  }\n  /* faint diagonal stripes — the \"no real footage yet\" tell */\n  .feed::before{\n    content:\"\";position:absolute;inset:0;\n    background-image:repeating-linear-gradient(\n      135deg,\n      transparent 0 14px,\n      rgba(244,244,241,0.025) 14px 15px\n    );\n    pointer-events:none;\n  }\n  .feed-video{\n    position:absolute;inset:0;width:100%;height:100%;\n    object-fit:cover;display:block;z-index:1;\n  }\n  /* when a real video loads, hide the placeholder graphics; keep HUD overlays */\n  .feed--has-video::before{display:none;}\n  .feed--has-video .reticle,\n  .feed--has-video .scan{display:none;}\n  /* HUD overlays sit above any loaded video */\n  .feed .fc, .feed .feed-label, .feed .feed-tc,\n  .feed .feed-id, .feed .feed-bar{z-index:2;}\n  /* corner crosshair markers on the feed */\n  .feed .fc{position:absolute;width:18px;height:18px;}\n  .feed .fc::before,.feed .fc::after{content:\"\";position:absolute;background:var(--fg);}\n  .feed .fc::before{left:0;right:0;top:50%;height:1px;}\n  .feed .fc::after{top:0;bottom:0;left:50%;width:1px;}\n  .feed .fc.tl{top:8px;left:8px;}\n  .feed .fc.tr{top:8px;right:8px;}\n  .feed .fc.bl{bottom:8px;left:8px;}\n  .feed .fc.br{bottom:8px;right:8px;}\n\n  /* slow-moving scan reticle */\n  .feed .reticle{\n    position:absolute;left:50%;top:50%;\n    width:38%;aspect-ratio:1/1;\n    transform:translate(-50%,-50%);\n    border:1px solid rgba(244,244,241,0.5);\n    border-radius:50%;\n    animation:reticle-breathe 8s ease-in-out infinite;\n  }\n  .feed .reticle::before,\n  .feed .reticle::after{\n    content:\"\";position:absolute;background:rgba(244,244,241,0.5);\n  }\n  .feed .reticle::before{left:50%;top:-10%;bottom:-10%;width:1px;transform:translateX(-50%);}\n  .feed .reticle::after{top:50%;left:-10%;right:-10%;height: x;\n    border-top:1px solid var(--hair);\n    margin-top:120px;\n  }\n  .selection-grid{\n    display:grid;\n    grid-template-columns:1fr minmax(420px, 620px) 1fr;\n    align-items:start;gap:48px;\n  }\n  .selection .left-meta, .selection .right-meta{\n    display:flex;flex-direction:column;gap:10px;\n    color:var(--fg-dim);\n    font-family:var(--mono);font-size:10px;letter-spacing:0.18em;\n    text-transform:uppercase;\n    padding-top:8px;\n  }\n  .selection .right-meta{align-items:flex-end;text-align:right;}\n  .selection .body{\n    text-align:center;\n  }\n  .selection .stamp{\n    display:inline-flex;align-items:center;gap:10px;\n    border:1px solid var(--hair-strong);\n    padding:8px 14px;\n    font-family:var(--mono);font-size:10px;letter-spacing:0.28em;\n    color:var(--fg);text-transform:uppercase;\n  }\n  .selection .stamp .dot{\n    width:6px;height:6px;background:#ff2a2a;\n    animation:pulse 1.4s infinite ease-in-out;\n  }\n  .selection h2{\n    font-family:var(--grotesk);\n    font-weight:600;\n    letter-spacing:-0.04em;\n    font-size:clamp(40px,6.4vw,92px);\n    line-height:0.95;\n    margin:34px 0 38px;\n    color:var(--fg);\n  }\n  .selection h2 .punct{color:var(--fg-faint);}\n  .selection p{\n    font-family:var(--mono);\n    font-size:14px;\n    line-height:1.85;\n    letter-spacing:0.02em;\n    color:var(--fg);\n    max-width:54ch;\n    margin:0 auto;\n  }\n  .selection p.lede{\n    font-family:var(--grotesk);\n    font-weight:500;\n    letter-spacing:-0.02em;\n    font-size:clamp(22px, 2.4vw, 38px);\n    line-height:1.22;\n    color:var(--fg);\n    width:min(1100px, 92%);\n    margin:48px auto 0;\n    text-wrap:balance;\n  }\n  .selection p.restricted{\n    margin-top:28px;\n    color:var(--fg-faint);\n    font-family:var(--mono);\n    font-size:11px;\n    letter-spacing:0.22em;\n    text-transform:uppercase;\n  }\n  .selection p + p{margin-top:18px;color:var(--fg-dim);}\n\n  .selection .body{position:relative;}\n  .selection .body__noop{display:none;}\n\n  /* ---------- FOOTER ---------- */\n  footer{\n    position:relative;z-index:6;\n    border-top:1px solid var(--hair);\n    padding:32px 56px 36px;\n    display:flex;justify-content:space-between;align-items:center;\n    color:var(--fg-dim);\n  }\n  footer .icons{display:flex;gap:18px;align-items:center;}\n  footer .icons a{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:34px;height:34px;border:1px solid var(--hair);\n    color:var(--fg);transition:border-color .2s ease, background .2s ease;\n  }\n  footer .icons a:hover{border-color:var(--fg);}\n  footer .copy{\n    font-family:var(--mono);font-size:10px;letter-spacing:0.22em;\n    text-transform:uppercase;\n  }\n  footer .right{\n    font-family:var(--mono);font-size:10px;letter-spacing:0.22em;\n    text-transform:uppercase;\n    color:var(--fg-dim);\n  }\n\n  /* ---------- animations ---------- */  @keyframes pulse{\n    0%,100%{opacity:1;}\n    50%{opacity:0.18;}\n  }\n  @keyframes scan{\n    0%{top:-2%;}\n    100%{top:102%;}\n  }\n  @keyframes reticle-breathe{\n    0%,100%{transform:translate(-50%,-50%) scale(0.96);opacity:0.55;}\n    50%{transform:translate(-50%,-50%) scale(1.04);opacity:0.85;}\n  }\n  @keyframes flicker{\n    0%,96%,100%{opacity:1;}\n    97%{opacity:0.3;}\n    98%{opacity:1;}\n    99%{opacity:0.5;}\n  }\n  .flicker{animation:flicker 6s infinite;}\n\n  /* ---------- responsive trim ---------- */\n  @media (max-width:780px){\n    /* drop the fixed page chrome on mobile — corner annotations were colliding with the header */\n    .chrome{display:none;}\n    .frame{display:none;}\n    /* re-enable the system cursor on touch / small screens */\n    *{cursor:auto !important;}\n    #cursor{display:none !important;}\n\n    header.top{\n      padding:28px 20px 0;\n      flex-direction:row;\n      align-items:center;\n      gap:14px;\n    }\n    header.top .icons.top-icons a{width:34px;height:34px;}\n    header.top .tagline{display:none;}\n\n    .screen-one{height:auto;}\n    .hero{padding:112px 20px 72px;flex:none;}\n\n    .wordmark{width:fit-content;max-width:100%;padding-block:calc(min(46vw, 240px) * 0.4);}\n    .wordmark-img{width:min(46vw, 240px);}\n\n    .sublabel{\n      position:static;\n      flex-direction:column;\n      align-items:center;\n      text-align:center;\n      gap:10px;\n      margin-top:18px;\n    }\n    .sublabel .left,\n    .sublabel .right{\n      flex-wrap:wrap;\n      justify-content:center;\n      gap:10px 14px;\n    }\n\n    .feed-wrap{\n      width:100%;\n      margin:36px auto 0;\n    }\n    .feed{\n      /* ensure the video element actually paints — aspect-ratio + 100% width should give it real height */\n      min-height:200px;\n      background:#000;\n    }\n    .feed-caption{\n      flex-direction:column;\n      align-items:flex-start;\n      gap:6px;\n    }\n    /* mobile: hide secondary feed caption + right-meta column + utc, per spec */\n    .feed-caption .dim{display:none;}\n    .selection .right-meta{display:none;}\n\n    section.selection{\n      padding:80px 20px 96px;\n      margin-top:64px;\n    }\n    .selection-grid{\n      grid-template-columns:1fr;\n      gap:28px;\n    }\n    .selection .left-meta,\n    .selection .right-meta{\n      align-items:flex-start;\n      text-align:left;\n      flex-direction:row;\n      flex-wrap:wrap;\n      gap:10px 16px;\n      padding-top:0;\n    }\n    .selection .body{padding:0;}\n    .selection .body::before{display:none;}\n    .selection .stamp{font-size:9px;letter-spacing:0.22em;padding:7px 12px;}\n    .selection p.lede{\n      font-size:clamp(22px, 6.4vw, 32px);\n      line-height:1.22;\n      max-width:100%;\n      margin-top:32px;\n    }\n    .selection p{font-size:12.5px;line-height:1.7;max-width:100%;}\n\n    footer{\n      padding:22px 20px;\n      flex-direction:column;\n      gap:12px;\n      align-items:center;\n      text-align:center;\n    }\n  }\n\n  @media (max-width:420px){\n    header.top{padding:22px 16px 0;} ked{opacity:0.34;}\n  .step.is-locked .step-ctl{pointer-events:none;}\n  .step-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:14px;}\n\n  .field{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair-strong);padding-bottom:9px;transition:border-color .2s ease;}\n  .field:focus-within{border-color:var(--fg);}\n  .field .sig{font-family:var(--mono);font-size:13px;color:var(--fg-faint);}\n  .field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font-family:var(--mono);font-size:13px;letter-spacing:0.04em;padding:0;}\n  .field input::placeholder{color:var(--fg-faint);letter-spacing:0.04em;}\n\n  .btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--hair-strong);background:transparent;color:var(--fg);font-family:var(--mono);font-size:10px;letter-spacing:0.24em;text-transform:uppercase;padding:12px 18px;transition:border-color .2s ease,background .2s ease,color .2s ease,opacity .2s ease;}\n  .btn:hover{border-color:var(--fg);}\n  .btn.solid{border-color:var(--fg);}\n  .btn.solid:hover{background:var(--fg);color:var(--bg);}\n  .btn[disabled]{opacity:0.4;}\n  .btn.is-busy{opacity:0.55;}\n\n  .note{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-dim);margin-top:14px;min-height:13px;}\n  .note.err{color:var(--fg);}\n  .note.ok{color:var(--fg);}\n  .note .tick{display:inline-block;width:5px;height:5px;background:var(--fg);border-radius:50%;margin-right:9px;vertical-align:1px;}\n\n  .done-state{display:none;border-top:1px solid var(--hair);padding-top:44px;}\n  .done-state.show{display:block;}\n  .done-state h2{font-family:var(--grotesk);font-weight:500;font-size:clamp(24px,3vw,38px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 18px;color:var(--fg);}\n  .done-state p{font-family:var(--mono);font-size:12px;letter-spacing:0.06em;line-height:1.9;color:var(--fg-dim);margin:0;}\n  .done-state p a{color:var(--fg);bor s(dx) > 0.8 || Math.abs(dy) > 0.8) {\n      targetAngle = Math.atan2(dy, dx) * (180 / Math.PI);\n    }\n    px = mx;\n    py = my;\n  });\n\n  function shortAngleDiff(a, b) {\n    return ((b - a) % 360 + 540) % 360 - 180;\n  }\n\n  function tick() {\n    smoothAngle += shortAngleDiff(smoothAngle, targetAngle) * 0.1;\n    cursor.style.transform =\n      `translate(${mx}px,${my}px) rotate(${smoothAngle}deg) translate(-27px,-4px)`;\n    requestAnimationFrame(tick);\n  }\n\n  tick();\n<\u002Fscript>\n\n<script>\n/* ----------------------------------------------------------------\n   CONFIG — Google Apps Script Web App URL. Setup in APPS_SCRIPT.md\n   Paste your /exec URL below; until then the page refuses submissions.\n----------------------------------------------------------------- */\nvar ENDPOINT   = 'https://script.google.com/macros/s/AKfycbyg30VySGJVWC17njhX0VNbyN3ID5tGr1jMG5vnvcvVoI84c4DStuWaV23OQFwKLN6n/exec';\nvar LAB_HANDLE = 'sprmlabs';\n\nvar FORM_READY = !!ENDPOINT;\n\n(function(){\n  var step1=document.getElementById('step1'), step2=document.getElementById('step2'), step3=document.getElementById('step3');\n  var handle=document.getElementById('handle'), wallet=document.getElementById('wallet');\n  var verifyBtn=document.getElementById('verifyBtn'), submitBtn=document.getElementById('submitBtn');\n  var note1=document.getElementById('note1'), note2=document.getElementById('note2'), note3=document.getElementById('note3');\n  var apply=document.getElementById('apply'), done=document.getElementById('done');\n  var followBtn=document.getElementById('followBtn');\n  var verified='';\n\n  function say(el,msg,cls){el.className='note'+(cls?' '+cls:'');el.innerHTML=msg;}\n  function clean(v){return String(v||'').trim().replace(/^@+/,'').replace(/^https?:\\/\\/(www\\.)?(x|twitter)\\.com\\//i,'').replace(/[\\/?#].*$/,'');}\n\n  var clicked=false;\n  followBtn.addEventListener('click',function(){\n    clicked=true;\n    step1.classList.add('is-done');\n    say(note1,'<span class=\"tick\"><\u002Fspan>opened @'+LAB_HANDLE+'. follow, then confirm below.','ok');\n    step2.classList.remove('is-locked');\n    handle.disabled=false;verifyBtn.disabled=false;\n    handle.focus();\n  });\n  try{localStorage.removeItem('sprm-followed');}catch(e){}\n\n  function post(payload){\n    // text/plain avoids a CORS preflight, which Apps Script cannot answer.\n    return fetch(ENDPOINT,{\n      method:'POST',\n      headers:{'Content-Type':'text/plain;charset=utf-8'},\n      body:JSON.stringify({wallet:payload.wallet,twitter:'@'+payload.handle})\n    }).then(function(r){return r.json();});\n  }\n\n  verifyBtn.addEventListener('click',function(){\n    if(!clicked){say(note2,'follow @'+LAB_HANDLE+' to continue.','err');return;}\n    var h=clean(handle.value);\n    if(!/^[A-Za-z0-9_]{1,15}$/.test(h)){say(note2,'enter a valid X username.','err');return;}\n    verified=h;\n    handle.disabled=true;\n    verifyBtn.disabled=true;\n    step2.classList.add('is-done');\n    say(note2,'<span class=\"tick\"><\u002Fspan>@'+h+' confirmed.','ok');\n    step3.classList.remove('is-locked');\n    step3.classList.add('is-open');\n    wallet.disabled=false;submitBtn.disabled=false;\n    wallet.focus();\n  });\n\n  handle.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();verifyBtn.click();}});\n  wallet.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitBtn.click();}});\n\n  submitBtn.addEventListener('click',function(){\n    var w=String(wallet.value||'').trim();\n    if(!/^0x[a-fA-F0-9]{40}$/.test(w)){say(note3,'enter a valid EVM address (0x + 40 characters).','err');return;}\n    if(!verified){say(note3,'verify your X account first.','err');return;}\n    if(!FORM_READY){say(note3,'submissions unavailable. try again shortly.','err');return;}\n    submitBtn.disabled=true;submitBtn.classList.add('is-busy');\n    say(note3,'submitting&hellip;');\n\n    post({handle:verified,wallet:w}).then(function(res){\n      if(res && (res.status==='ok' || res.ok)){\n        apply.classList.add('is-submitted');\n        done.classList.add('show');\n      } else {\n        submitBtn.disabled=false;submitBtn.classList.remove('is-busy');\n        say(note3,(res&&res.message)||'submission failed. try again.','err');\n      }\n    }).catch(function(){\n      submitBtn.disabled=false;submitBtn.classList.remove('is-busy');\n      say(note3,'network error, please try again.','err');\n    });\n  });\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
